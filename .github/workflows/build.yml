name: Build LidarMap IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source zip (first run only)
        shell: bash
        run: |
          shopt -s nullglob
          for z in *LidarMap-nguon.zip; do
            unzip -oq "$z" -x ".github/*" "__MACOSX/*"
            rm -f "$z"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "Unpack LidarMap source"
            git push origin HEAD:main
          done
          ls -la

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Xcode info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build unsigned
        shell: bash
        run: |
          set +e
          xcodebuild \
            -project LidarMap.xcodeproj \
            -scheme LidarMap \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build.log 2>&1
          code=$?
          set -e
          grep -E "error:|BUILD SUCCEEDED|BUILD FAILED" build.log | sort -u | head -60 || true
          exit $code

      - name: Package IPA
        shell: bash
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "LidarMap.app" | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry LidarMap.ipa Payload
          ls -lh LidarMap.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LidarMap-ipa
          path: LidarMap.ipa

      - name: Publish IPA to Releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest LidarMap.ipa \
            --title "LidarMap latest build" \
            --notes "Download LidarMap.ipa and install with SideStore. Commit: $GITHUB_SHA" \
            --prerelease \
            --target "$GITHUB_SHA"

      - name: Error summary
        if: failure()
        shell: bash
        run: |
          {
            echo "### Build errors"
            echo '```'
            grep -E "error:" build.log | sort -u | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
